name: ci
on: [push, pull_request]
jobs:
  # Exactly what the evaluator runs (no API key needed for the offline suite)
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup
      - run: make test

  # `make setup` must survive awkward machines, not just a prepared CI runner
  setup-edge-cases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-without-python3-venv   # python3 present, but `python3 -m venv` is broken
            image: debian:bookworm
            prep: apt-get update -qq && apt-get install -y -qq git make python3 python3-pip curl >/dev/null
          - name: python-too-old                # only Python 3.9 on PATH -> setup must fetch a newer one
            image: python:3.9-slim
            prep: apt-get update -qq && apt-get install -y -qq git make curl >/dev/null
          - name: python-slim                   # stock official image
            image: python:3.12-slim
            prep: apt-get update -qq && apt-get install -y -qq git make >/dev/null
    name: setup (${{ matrix.name }})
    container: ${{ matrix.image }}
    steps:
      - run: ${{ matrix.prep }}
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make setup
      - run: make test
      - name: make run without a key fails with a clear message
        run: |
          out=$(make run 2>&1 </dev/null || true)
          echo "$out"
          echo "$out" | grep -q "AI_API_KEY is not set"
