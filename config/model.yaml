# ---------------------------------------------------------------------------
# VeriSWE model configuration
#
# The API credential is NEVER stored here. It is read at runtime from the
# environment variable AI_API_KEY (see .env.example).
#
# Every value below can be overridden without editing this file:
#   AI_MODEL      -> model_name
#   AI_PROVIDER   -> provider   (auto | deepseek | dashscope | openrouter | siliconflow | together | openai | anthropic | gemini | groq | ...)
#   AI_BASE_URL   -> base_url   (any OpenAI-compatible endpoint, e.g. vLLM / Ollama / a proxy)
#   AI_TEXT_MODE  -> action_mode=text when "1", toolcall when "0"
# ---------------------------------------------------------------------------

# OFFICIAL EVALUATION: the organisers use DeepSeek and Qwen models.
# Leave model_name empty and VeriSWE picks the strongest DeepSeek/Qwen model the key can access:
#   * a generic "sk-..." key is matched to its host by probing GET /models (DeepSeek, Alibaba DashScope in all
#     regions, SiliconFlow, OpenAI, Together, Fireworks, DeepInfra); distinctive keys (sk-or-, sk-ws, sk-sp-, sk_,
#     gsk_, nvapi-, hf_, ...) map directly;
#   * the model is chosen from that host's list, preferring (2026-09): deepseek-flash (V4.1) > deepseek-v4-pro >
#     qwen3.8-max > qwen3-coder-plus > ... (see PREFERENCE in src/veriswe/model_config.py).
# Set model_name (or AI_MODEL) to pin an exact model; an explicitly configured model is never substituted.
model_name: ""

# auto = infer from the AI_API_KEY prefix (sk-ant- -> anthropic, AIza -> gemini, sk-or- -> openrouter, ...)
provider: auto

# Optional OpenAI-compatible endpoint.
base_url: ""

# auto = probe the model once at startup: use native tool calling if it works,
# otherwise fall back to plain-text actions (```mswea_bash_command blocks).
action_mode: auto   # auto | toolcall | text

# Reproducibility: greedy decoding by default. (Parameters a model does not support are dropped automatically.)
model_kwargs:
  temperature: 0.0
  drop_params: true
  timeout: 900          # DeepSeek may queue a request for up to 10 min before inference starts

# Per-model-family settings, applied in order when `match` (regex) matches the resolved model name.
model_overrides:
  # DeepSeek V4.x thinks by default. Asking for it explicitly makes LiteLLM pass `reasoning_content` back on
  # every turn, which DeepSeek REQUIRES in tool-calling conversations (otherwise: HTTP 400 on the 2nd turn).
  # Temperature is ignored by DeepSeek in thinking mode.
  - match: "^deepseek/"
    model_kwargs:
      reasoning_effort: high
  # Qwen's published sampling for agentic coding (greedy decoding makes Qwen3 prone to repetition loops).
  # Fixed values, so runs remain as reproducible as the API allows.
  - match: "qwen"
    model_kwargs:
      temperature: 0.7
      top_p: 0.8

# Used when the provider is known but no model is configured and the host's model list is unavailable.
provider_defaults:
  deepseek: deepseek-flash
  dashscope: qwen3.8-max
  openrouter: deepseek/deepseek-v4.1-flash
  siliconflow: deepseek-ai/DeepSeek-V4.1-Flash
  together: deepseek-ai/DeepSeek-V4.1-Flash
  anthropic: claude-sonnet-5
  openai: gpt-5
  gemini: gemini-2.5-pro
  groq: openai/gpt-oss-120b
  xai: grok-4
  mistral: devstral-medium-latest
