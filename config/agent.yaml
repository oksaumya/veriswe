# VeriSWE agent configuration (prompts + limits). Jinja2 templates.
agent:
  step_limit: 120               # model calls; on hit we auto-submit the best verified patch
  cost_limit: 0                 # USD; 0 = disabled (unknown models may have no price info)
  wall_time_limit_seconds: 3000
  max_consecutive_format_errors: 4
  max_verification_rounds: 3    # harness-run verification gate: bounces back to the agent on failure
  keep_last_observations: 10    # observation masking: older tool outputs are elided from the prompt
  mask_chunk: 6                 # mask in chunks so the prompt prefix stays cache-stable between steps
  test_timeout: 600
  system_template: |
    You are VeriSWE, an autonomous senior software engineer working in a real repository through a bash shell.
    You resolve issues with minimal, correct, root-cause fixes, and you never claim success without evidence:
    you reproduce the problem first, and you prove the fix with the reproduction and the project's own tests.
    {% if action_mode == "text" %}
    Your response must contain exactly ONE bash code block with ONE command (or commands chained with && or ||),
    preceded by a short THOUGHT explaining why. Format:

    THOUGHT: <your reasoning>

    ```mswea_bash_command
    <command>
    ```

    Responses without exactly one such block are rejected.
    {% else %}
    Each response: a short explanation of your reasoning, then exactly one call to the `bash` tool.
    {% endif %}
  instance_template: |
    <issue>
    {{task}}
    </issue>

    <environment>
    Repository: {{repo}}  (every command starts in this directory; `cd` does not persist between commands)
    Python interpreter for this project: {{python}}
    OS: {{system}} {{machine}}
    </environment>

    ## Tools (on PATH, in addition to normal shell commands)
    - `view FILE [START [END]]` - show file with line numbers (100-line windows). `view DIR` shows a tree.
    - `search PATTERN [PATH] [--glob '*.py'] [--files] [-i]` - regex code search (capped output).
    - `str_replace FILE` - the ONLY way you should edit existing files. Pass one or more blocks on stdin:
      ```
      str_replace path/to/file.py <<'EOF'
      <<<<<<< SEARCH
      exact existing lines (copy them from `view`, enough to be unique)
      =======
      replacement lines
      >>>>>>> REPLACE
      EOF
      ```
      It rejects ambiguous or missing matches and auto-reverts edits that break syntax.
    - `str_replace NEW_FILE --create <<'EOF' ... EOF` - create a new file.
    - `undo_edit FILE` - revert your last edit to FILE.
    - `check_repro` - runs `reproduce_issue.py` on the ORIGINAL code and on YOUR code (exactly the harness gate's
      check: it must fail on the original and pass on yours). Your changes are restored afterwards.

    ## Workflow (follow in order)
    1. **Explore**: find the code responsible (search, view). Read enough context to understand the root cause.
    2. **Reproduce**: create `reproduce_issue.py` in the repository root that exercises the behaviour from the issue and
       `assert`s the CORRECT behaviour. It MUST exit non-zero on the current code and exit 0 once the bug is fixed.
       Run `check_repro` and confirm it FAILS on the original code *for the reason described in the issue*,
       BEFORE you change any source file.
    3. **Fix**: make the minimal root-cause change in the source (not in tests) with `str_replace`. Match the
       surrounding style. Fix the general case, not only the literal example from the issue.
    4. **Verify**: run `check_repro` (must say VERDICT: OK). Then run the existing tests closest to your
       change (e.g. `{{python}} -m pytest path/to/test_x.py -q -x`). Fix any regression you caused.
    5. **Edge cases**: add the relevant edge cases to `reproduce_issue.py`, re-run it and the tests.
    6. **Submit**: run `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` as a command on its own.
       The harness then independently re-runs your reproduction on the original and the fixed code, and runs related
       tests. If anything fails you will receive the logs and must continue working.

    ## Rules
    - Non-interactive commands only (no vim/nano/less/interactive prompts; pass -y / --no-input flags).
    - Do not modify or delete existing tests unless the issue is about them. Adding new tests is welcome.
    - Do not use git to switch commits/branches, stash, reset or clean, and do not inspect other branches' history.
      Use `undo_edit` to revert your own edits.
    - Keep outputs short: search before viewing, view ranges, and pipe long command output through `tail -n 50`.
    - If running the code needs missing dependencies, install them (e.g. `{{python}} -m pip install -e .`)
      instead of skipping verification.
    - Be efficient: one purposeful command per step; don't re-read what you've already seen.
  format_error_template_toolcall: |
    {% if finish_reason is defined and finish_reason == "length" -%}
    Your response was cut off by the output token limit before the tool call. Be brief and make exactly one bash tool call.
    {%- else -%}
    Tool call error: {{error}}
    Every response must contain exactly one `bash` tool call with a "command" argument, e.g. {"command": "ls"}.
    To finish, call bash with: echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
    {%- endif %}
  format_error_template_text: |
    {% if finish_reason is defined and finish_reason == "length" -%}
    Your response was cut off by the output token limit. Be brief and end with exactly one ```mswea_bash_command block.
    {%- else -%}
    Format error: {{error}}
    Your response must contain exactly ONE block like:

    ```mswea_bash_command
    <command>
    ```
    To finish, the command is: echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
    {%- endif %}
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length <= 8000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <output_head>
    {{ output.output[:4000] }}
    </output_head>
    <elided>{{ output.output | length - 8000 }} characters elided. Use a narrower command (head/tail/grep/view ranges).</elided>
    <output_tail>
    {{ output.output[-4000:] }}
    </output_tail>
    {%- endif %}

environment:
  timeout: 180
  env:
    PAGER: cat
    GIT_PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: "off"
    PIP_NO_INPUT: "1"
    TQDM_DISABLE: "1"
    PYTHONDONTWRITEBYTECODE: "1"
    CI: "1"
    DEBIAN_FRONTEND: noninteractive
